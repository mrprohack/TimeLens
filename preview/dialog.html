<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TimeLens Dialog Preview</title><link rel="stylesheet" href="../src/shared/theme.css"><link rel="stylesheet" href="../src/dashboard/dashboard.css"><style>.dialog-backdrop{display:grid!important}</style></head>
<body><main class="dashboard-shell"><div class="page-heading"><div><div class="eyeline">Limits</div><h1>Keep the boundaries simple.</h1><p class="muted">The dialog uses the same instrument grammar as every other surface.</p></div></div></main><div class="dialog-backdrop"><div class="dialog-panel panel" role="dialog" aria-modal="true"><div class="dialog-heading"><div><div class="eyeline">Limit</div><h2>Add a site limit</h2></div><button class="icon-close">×</button></div><label class="label"><span>Website</span><input class="input" value="youtube.com"></label><div class="settings-grid"><label class="label"><span>Time limit</span><select class="input"><option>60 minutes</option></select></label><label class="label"><span>Reset</span><select class="input"><option>Daily</option></select></label></div><div class="advanced-options"><button class="disclosure-button"><span>Advanced options</span><span>›</span></button><p class="muted small">Strict mode and schedules stay progressively disclosed.</p></div><div class="dialog-actions"><button class="btn">Cancel</button><button class="btn btn-primary">Save limit</button></div></div></div></body></html>
