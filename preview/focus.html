<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TimeLens Focus Preview</title><link rel="stylesheet" href="../src/shared/theme.css"><link rel="stylesheet" href="../src/dashboard/dashboard.css"></head>
<body>
<header class="app-header"><div class="header-inner"><div class="brand"><span class="brand-mark"></span><span>TimeLens</span></div><nav class="header-nav"><button class="nav-link">Home</button><button class="nav-link">Limits</button><button class="nav-link is-active">Focus</button><button class="nav-link">Settings</button></nav><div class="sidebar-secondary"><button class="nav-link secondary-link">Usage History</button></div><div class="sidebar-status"><span class="status-pulse"></span><span><strong>Local tracking</strong><small>Private on this device</small></span></div></div></header>
