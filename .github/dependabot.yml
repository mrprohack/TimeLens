version: 2

updates:
  # The two Tailwind packages are pinned to the same version and must move
  # together, so Dependabot raises one pull request for the pair.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    groups:
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/cli"
    labels:
      - enhancement

  # The workflow pins actions to full commit SHAs; Dependabot updates both the
  # SHA and the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    labels:
      - enhancement
