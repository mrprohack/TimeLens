name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Test and validate extension
        run: npm run check
      - name: Build Chrome Web Store package
        run: npm run package
      - name: Upload release package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: timelens-1.3.0
          path: dist/timelens-1.3.0.zip
          if-no-files-found: error
