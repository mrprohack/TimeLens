<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TimeLens</title>
  <script src="../shared/theme-init.js"></script>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell" aria-live="polite" data-loading="true">
    <header class="popup-header">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>TimeLens</span></div>
      <span id="tracking-status" class="tracking-status"><span class="status-dot"></span>Tracking</span>
    </header>

    <section class="today-summary" aria-labelledby="today-label">
      <div class="summary-heading"><strong id="today-label">Today's Summary</strong><span id="on-track-pill" class="on-track-pill" data-tone="loading">—</span></div>
      <div class="summary-grid">
        <div class="summary-ring" style="--summary-progress:0deg">
          <span><strong id="today-total">—</strong><small>Today</small></span>
        </div>
        <div class="summary-facts">
          <div><small>Sites visited</small><strong id="popup-site-count">—</strong></div>
          <div><small>Focus</small><strong id="popup-focus-status">—</strong></div>
        </div>
      </div>
      <div class="current-card">
        <div class="site-avatar" id="current-avatar" aria-hidden="true">—</div>
        <div class="current-copy">
          <div class="muted small">Current website</div>
          <div id="current-domain" class="current-domain">—</div>
          <div id="current-usage" class="muted small">—</div>
        </div>
        <div id="current-boundary" class="boundary-copy small">—</div>
      </div>
    </section>

    <div class="primary-actions">
      <button id="focus-toggle" class="btn btn-primary" type="button">Start Focus</button>
      <button id="limit-current-site" class="btn" type="button">Limit this site</button>
    </div>

    <div id="quick-options" class="quick-options" hidden>
      <div id="focus-presets" class="chip-row" role="group" aria-label="Start another Focus preset" hidden></div>
      <div id="limit-choices" class="chip-row" role="group" aria-label="Daily time for the site limit" hidden></div>
    </div>

    <div id="notice" class="notice" role="status" aria-live="polite" hidden>
      <span data-notice-text></span>
      <button class="undo-link" type="button" data-notice-action hidden></button>
    </div>

    <section id="top-sites-section" class="sites-section" aria-labelledby="top-sites-heading">
      <div class="section-heading"><h2 id="top-sites-heading">Top sites</h2><span class="muted">Today</span></div>
      <div id="top-sites" class="site-list"></div>
    </section>

    <footer class="popup-footer">
      <button id="open-dashboard" class="footer-link" type="button">Open Dashboard ↗</button>
      <button id="open-side-panel" class="footer-link" type="button">Side Panel</button>
    </footer>

    <div id="error-message" class="error-message" role="alert" hidden></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
