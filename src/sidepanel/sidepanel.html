<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TimeLens</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="side-shell">
    <header class="side-header">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>TimeLens</span></div>
      <button id="side-open-dashboard" class="btn btn-quiet" type="button">Dashboard</button>
    </header>

    <section class="panel current-panel" aria-labelledby="side-current-domain">
      <div class="eyeline">Current website</div>
      <h1 id="side-current-domain">No active website</h1>
      <strong id="side-current-time" class="current-time">0m today</strong>
      <p id="side-boundary" class="muted">No active limit.</p>
    </section>

    <section class="panel quick-panel" aria-labelledby="quick-limit-title">
      <div class="section-row"><div><div class="eyeline">Quick limit</div><h2 id="quick-limit-title">Limit this site</h2></div></div>
      <div class="quick-limit">
        <select id="side-limit-minutes" class="input" aria-label="Daily site limit">
          <option value="15">15 min</option><option value="30" selected>30 min</option><option value="45">45 min</option><option value="60">60 min</option>
        </select>
        <button id="side-limit-site" class="btn" type="button">Set limit</button>
      </div>
    </section>

    <section class="panel quick-panel" aria-labelledby="side-focus-title">
      <div class="section-row"><div><div class="eyeline">Focus</div><h2 id="side-focus-title">Protect your attention</h2></div><span id="side-focus-state" class="muted small">Ready</span></div>
      <button id="side-focus-action" class="btn btn-primary" type="button">Start 25 min Focus</button>
      <div id="side-focus-presets" class="preset-chips" aria-label="Focus presets"></div>
    </section>

    <p id="side-status" class="status-line muted" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
